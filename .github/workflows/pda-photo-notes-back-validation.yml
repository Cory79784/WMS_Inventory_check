name: PDA photo notes back validation
on:
  push:
    branches: [fix/pda-photo-notes-back]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.worker.json --noEmit
      - run: npm run build
      - run: npm test
