name: P0 validation (no deployment)
on:
  push:
    branches: [codex/p0-minimal-20261013]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.worker.json --noEmit
      - run: npm run build
      - run: npm test
